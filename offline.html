<!DOCTYPE html><html lang="vi"><head><meta charset="utf-8"><title>sybauargon</title>
<style>body{margin:0;height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;font:15px system-ui,Segoe UI,sans-serif;background:#17181d;color:#e8e9f0;text-align:center}
h1{margin:0;font-size:22px;background:linear-gradient(135deg,#8b7bff,#ff7bb3);-webkit-background-clip:text;background-clip:text;color:transparent}
p{margin:0;color:#8d90a3}.sp{width:26px;height:26px;border:3px solid #333;border-top-color:#8b7bff;border-radius:50%;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}</style></head>
<body><div class="sp"></div><h1>Mất kết nối</h1><p>Không mở được sybauargon. Đang tự thử lại…</p><p id="c" style="font-size:12px"></p>
<script>
var url=new URLSearchParams(location.search).get('url')||'https://sybauargon.site.je/',n=8;
function tick(){document.getElementById('c').textContent='Thử lại sau '+n+' giây';if(--n<0){n=8;fetch(url,{mode:'no-cors',cache:'no-store'}).then(function(){location.href=url}).catch(function(){})}}
setInterval(tick,1000);tick();
</script></body></html>

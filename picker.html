<!DOCTYPE html><html lang="vi"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<style>
body{margin:0;font:14px system-ui,Segoe UI,sans-serif;background:#1d1e25;color:#e8e9f0;padding:16px}
h2{margin:0 0 12px;font-size:17px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.it{background:#272833;border:2px solid transparent;border-radius:12px;padding:8px;cursor:pointer;text-align:center}
.it:hover{border-color:#8b7bff}.it img{width:100%;border-radius:8px;background:#000}
.it div{margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style></head><body>
<h2>Chọn màn hình hoặc cửa sổ để chia sẻ</h2><div class="grid" id="g"></div>
<script>
window.picker.onSources(function(list){var g=document.getElementById('g');list.forEach(function(s){var d=document.createElement('div');d.className='it';
var i=document.createElement('img');i.src=s.thumb;var t=document.createElement('div');t.textContent=s.name;d.append(i,t);d.onclick=function(){window.picker.choose(s.id)};g.append(d)})});
</script></body></html>
